[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "deepglobe-resnet-transformer"
version = "0.1.0"
description = "CPU-oriented DeepGlobe land-cover segmentation with a ResNet-34 encoder and lightweight Transformers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "torchvision>=0.18",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
